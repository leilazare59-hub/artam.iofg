name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - arena/90cb42e2-artam-iofg
      - main
    paths:
      - docs/**
      - .github/workflows/pages-deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy docs/ to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Pages site is enabled
        id: ensure
        env:
          GH_TOKEN_WORKFLOW: ${{ github.token }}
        run: |
          API="https://api.github.com/repos/$GITHUB_REPOSITORY/pages"
          code=$(curl -s -o /tmp/pages.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN_WORKFLOW" \
            -H "Accept: application/vnd.github+json" "$API")
          echo "GET /pages -> HTTP $code"
          if [ "$code" = "200" ]; then
            bt=$(grep -o '"build_type":"[^"]*"' /tmp/pages.json | head -1 | cut -d'"' -f4)
            echo "build_type=$bt"
            if [ "$bt" = "workflow" ]; then
              echo "ok=true" >> "$GITHUB_OUTPUT"
            else
              echo "ok=false" >> "$GITHUB_OUTPUT"
              echo "::warning::Pages از طریق شاخه (Deploy from a branch) فعال است؛ خود گیت‌هاب پوشه docs/ را منتشر می‌کند و این ورک‌فلو لازم نیست."
            fi
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages هنوز برای این مخزن فعال نشده است. از Settings > Pages منبع را روی شاخه و پوشه /docs قرار دهید، یا سورس را GitHub Actions بگذارید؛ پس از آن این ورک‌فلو خودکار منتشر می‌کند."
          fi

      - name: Upload artifact
        if: steps.ensure.outputs.ok == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        if: steps.ensure.outputs.ok == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
