name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - arena/90cb42e2-artam-iofg
      - main
    paths:
      - docs/**
      - .github/workflows/pages-deploy.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy docs/ to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Ensure Pages site is enabled
        env:
          GH_TOKEN_WORKFLOW: ${{ github.token }}
        run: |
          set -e
          API="https://api.github.com/repos/$GITHUB_REPOSITORY/pages"
          code=$(curl -s -o /tmp/pages.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN_WORKFLOW" \
            -H "Accept: application/vnd.github+json" "$API")
          post_code="skipped"
          echo "GET /pages -> HTTP $code"
          if [ "$code" = "404" ]; then
            echo "Pages site not found -> enabling with build_type=workflow ..."
            post_code=$(curl -s -o /tmp/post.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GH_TOKEN_WORKFLOW" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              -d '{"build_type":"workflow"}' "$API")
            echo "POST /pages -> HTTP $post_code"
            cat /tmp/post.json || true
            echo
          fi
          # ثبت وضعیت برای عیب‌یابی (commit-back)
          mkdir -p diag
          {
            echo "{"
            echo "  \"get_pages\": $code,"
            echo "  \"post_pages\": \"$post_code\","
            echo "  \"post_body\": $(python3 -c 'import json,os; p="/tmp/post.json"; print(json.dumps(open(p).read()[:400]) if os.path.exists(p) else "null")' 2>/dev/null || echo null),"
            echo "  \"run\": \"$GITHUB_RUN_ID\""
            echo "}"
          } > diag/pages-status.json
          if [ "$post_code" != "skipped" ] && [ "$post_code" != "201" ] && [ "$post_code" != "202" ]; then
            git config user.name "pages-bot"
            git config user.email "pages-bot@users.noreply.github.com"
            git add diag/pages-status.json
            git commit -q -m "diag: pages enablement status (run $GITHUB_RUN_ID)" || true
            git push -q origin HEAD:"$GITHUB_REF_NAME" || true
            echo "::error::Failed to enable GitHub Pages (HTTP $post_code)"
            exit 1
          fi
          if [ "$code" = "404" ]; then
            git config user.name "pages-bot"
            git config user.email "pages-bot@users.noreply.github.com"
            git add diag/pages-status.json
            git commit -q -m "diag: pages enabled ok (run $GITHUB_RUN_ID)" || true
            git push -q origin HEAD:"$GITHUB_REF_NAME" || true
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
