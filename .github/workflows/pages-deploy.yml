name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - arena/90cb42e2-artam-iofg
      - main
    paths:
      - docs/**
      - .github/workflows/pages-deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy docs/ to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Pages site is enabled
        env:
          GH_TOKEN_WORKFLOW: ${{ github.token }}
        run: |
          set -e
          API="https://api.github.com/repos/$GITHUB_REPOSITORY/pages"
          code=$(curl -s -o /tmp/pages.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN_WORKFLOW" \
            -H "Accept: application/vnd.github+json" "$API")
          echo "GET /pages -> HTTP $code"
          if [ "$code" = "404" ]; then
            echo "Pages site not found -> enabling with build_type=workflow ..."
            curl -sS -X POST \
              -H "Authorization: Bearer $GH_TOKEN_WORKFLOW" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              -d '{"build_type":"workflow"}' "$API"
            echo
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
